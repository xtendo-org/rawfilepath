name: CI

on:
  push:
    branches: [main, develop, fix/ci]
  # pull_request workflows operate on GitHub's temporary merge commit,
  # ensuring we test the exact code that would land on main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  stack-test:
    name: stack-test-${{ matrix.cache_prefix }}-${{ matrix.lts }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cache_prefix: linux
            lts: lts23
            resolver: lts-23.28
            workdir: .stack-work-lts23
          - os: ubuntu-24.04
            cache_prefix: linux
            lts: lts24
            resolver: lts-24.28
            workdir: .stack-work-lts24
          - os: macos-14
            cache_prefix: macos
            lts: lts23
            resolver: lts-23.28
            workdir: .stack-work-lts23
          - os: macos-14
            cache_prefix: macos
            lts: lts24
            resolver: lts-24.28
            workdir: .stack-work-lts24
    runs-on: ${{ matrix.os }}
    env:
      STACK_RESOLVER: ${{ matrix.resolver }}
      STACK_WORK_DIR: ${{ matrix.workdir }}
    steps:
      - name: Restore Stack cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.stack-bin
            ~/.ghcup
            ~/.cabal
            ~/.stack
            ${{ matrix.workdir }}
          key: ${{ matrix.cache_prefix }}-${{ matrix.lts }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.cache_prefix }}-${{ matrix.lts }}-
            ${{ matrix.cache_prefix }}-

      - name: Record cache size before
        shell: bash
        run: |
          set -euo pipefail

          total_kb=$(
            (du -sk "${HOME}/.stack-bin" "${HOME}/.ghcup" "${HOME}/.cabal" "${HOME}/.stack" "${STACK_WORK_DIR}" 2>/dev/null || true) \
              | awk '{sum += $1} END {print sum + 0}'
          )
          echo "CACHE_SIZE_BEFORE=${total_kb}" >>"$GITHUB_ENV"

      - name: Add tools to PATH
        shell: bash
        run: |
          echo "${HOME}/.stack-bin" >>"$GITHUB_PATH"
          echo "${HOME}/.ghcup/bin" >>"$GITHUB_PATH"
          echo "${HOME}/.cabal/bin" >>"$GITHUB_PATH"

      - name: Check for toolchain
        id: toolchain-check
        shell: bash
        run: |
          if command -v stack >/dev/null 2>&1; then
            echo "stack_found=true" >>"$GITHUB_OUTPUT"
          else
            echo "stack_found=false" >>"$GITHUB_OUTPUT"
          fi
          if command -v ghc >/dev/null 2>&1; then
            echo "ghc_found=true" >>"$GITHUB_OUTPUT"
          else
            echo "ghc_found=false" >>"$GITHUB_OUTPUT"
          fi
          if command -v cabal >/dev/null 2>&1; then
            echo "cabal_found=true" >>"$GITHUB_OUTPUT"
          else
            echo "cabal_found=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install toolchain
        if: steps.toolchain-check.outputs.stack_found != 'true' || steps.toolchain-check.outputs.ghc_found != 'true' || steps.toolchain-check.outputs.cabal_found != 'true'
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Generate stack.yaml for CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STACK_WORK_DIR}"
          cat >"${STACK_WORK_DIR}/stack.yaml" <<EOF
          resolver: ${STACK_RESOLVER}
          packages:
            - ${GITHUB_WORKSPACE}
          EOF

      - name: Record cache timestamp
        id: cache-ts
        shell: bash
        run: echo "cache_ts=$(date -u +"%Y%m%d%H%M%S")" >>"$GITHUB_OUTPUT"

      - name: Setup resolver compiler
        shell: bash
        run: |
          set -euo pipefail
          stack --stack-yaml "${STACK_WORK_DIR}/stack.yaml" --work-dir "${STACK_WORK_DIR}" setup
          compiler_bin=$(stack --stack-yaml "${STACK_WORK_DIR}/stack.yaml" --work-dir "${STACK_WORK_DIR}" path --compiler-bin)
          echo "${compiler_bin}" >>"$GITHUB_PATH"

      - name: Print working directory
        shell: bash
        run: |
          pwd
          ls

      - name: Run stack build (warnings as errors)
        shell: bash
        run: |
          set -euo pipefail
          stack --stack-yaml "${STACK_WORK_DIR}/stack.yaml" --work-dir "${STACK_WORK_DIR}" --system-ghc build --no-terminal --ghc-options "-Werror"

      - name: Run stack test
        shell: bash
        run: |
          set -euo pipefail
          stack --stack-yaml "${STACK_WORK_DIR}/stack.yaml" --work-dir "${STACK_WORK_DIR}" --system-ghc test --no-terminal

      - name: Record cache size after
        shell: bash
        run: |
          set -euo pipefail

          total_kb=$(
            (du -sk "${HOME}/.stack-bin" "${HOME}/.ghcup" "${HOME}/.cabal" "${HOME}/.stack" "${STACK_WORK_DIR}" 2>/dev/null || true) \
              | awk '{sum += $1} END {print sum + 0}'
          )
          echo "CACHE_SIZE_AFTER=${total_kb}" >>"$GITHUB_ENV"

      - name: Save Stack cache
        if: always() && env.CACHE_SIZE_BEFORE != env.CACHE_SIZE_AFTER
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.stack-bin
            ~/.ghcup
            ~/.cabal
            ~/.stack
            ${{ matrix.workdir }}
          key: ${{ matrix.cache_prefix }}-${{ matrix.lts }}-${{ steps.cache-ts.outputs.cache_ts }}
